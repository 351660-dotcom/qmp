server:
  port: 8092

spring:
  application:
    name: performance-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/performance_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:localhost:9876}
  producer:
    group: performance-service-producer

performance:
  reservation:
    hold-minutes: 15
  # 超时关单任务：扫描创建已超 hold-minutes 仍 PENDING_PAYMENT 的预订，释放预占并置 CANCELLED
  cancel-job:
    fixed-delay-ms: ${PERFORMANCE_CANCEL_JOB_FIXED_DELAY_MS:60000}
    tenant-ids: ${PERFORMANCE_CANCEL_JOB_TENANT_IDS:1001}
  client:
    payment-base-url: ${PAYMENT_BASE_URL:http://localhost:8085}

logging:
  level:
    com.qmp: INFO
