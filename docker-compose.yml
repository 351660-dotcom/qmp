name: scenic-saas

services:
  # ------------------------------------------------------------------
  # 中间件（v1 最小集，见 ADR-010 / 09 文档）
  # ------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: scenic-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: scenic-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.0
    container_name: scenic-rocketmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.3.0
    container_name: scenic-rocketmq-broker
    restart: unless-stopped
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.3.0/conf/broker.conf
    environment:
      - NAMESRV_ADDR=rocketmq-namesrv:9876
      # 限制 broker 堆，避免默认大堆在本地多服务环境内存压力下被反复重启（曾累计重启 20+ 次）
      - JAVA_OPT_EXT=-server -Xms1g -Xmx1g -Xmn512m
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    depends_on:
      - rocketmq-namesrv
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.0/conf/broker.conf:ro

  # ------------------------------------------------------------------
  # 门票全链路 7 个服务（各自独立 Spring Boot 应用，见各服务 CLAUDE.md）
  # ------------------------------------------------------------------
  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: scenic-product-service
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      ADMIN_API_TOKEN: scenic-admin-dev-token
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy

  pricing-service:
    build:
      context: .
      dockerfile: pricing-service/Dockerfile
    container_name: scenic-pricing-service
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      ADMIN_API_TOKEN: scenic-admin-dev-token
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy

  member-service:
    build:
      context: .
      dockerfile: member-service/Dockerfile
    container_name: scenic-member-service
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      ADMIN_API_TOKEN: scenic-admin-dev-token
      ROCKETMQ_NAMESRV: rocketmq-namesrv:9876
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: scenic-inventory-service
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      ADMIN_API_TOKEN: scenic-admin-dev-token
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: scenic-payment-service
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      ADMIN_API_TOKEN: scenic-admin-dev-token
      ROCKETMQ_NAMESRV: rocketmq-namesrv:9876
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started

  ticket-verification-service:
    build:
      context: .
      dockerfile: ticket-verification-service/Dockerfile
    container_name: scenic-ticket-verification-service
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      ADMIN_API_TOKEN: scenic-admin-dev-token
      ROCKETMQ_NAMESRV: rocketmq-namesrv:9876
      PAYMENT_BASE_URL: http://payment-service:8085
      INVENTORY_BASE_URL: http://inventory-service:8084
      # 本地/测试栈缩短凭证过期扫描间隔（生产默认 60s）
      VERIFICATION_EXPIRE_JOB_FIXED_DELAY_MS: "5000"
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: scenic-order-service
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      ADMIN_API_TOKEN: scenic-admin-dev-token
      ROCKETMQ_NAMESRV: rocketmq-namesrv:9876
      PRODUCT_BASE_URL: http://product-service:8081
      PRICING_BASE_URL: http://pricing-service:8082
      MEMBER_BASE_URL: http://member-service:8083
      INVENTORY_BASE_URL: http://inventory-service:8084
      PAYMENT_BASE_URL: http://payment-service:8085
      TICKET_VERIFICATION_BASE_URL: http://ticket-verification-service:8086
      # 本地/测试栈缩短超时关单扫描间隔（生产默认 60s）
      ORDER_CANCEL_JOB_FIXED_DELAY_MS: "5000"
    ports:
      - "8087:8087"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8087/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started
      product-service:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
      member-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      ticket-verification-service:
        condition: service_healthy

  # ------------------------------------------------------------------
  # 其它业态链路（ADR-025：独立建表/建库，复用 inventory-kernel）
  # ------------------------------------------------------------------
  hotel-pms-service:
    build:
      context: .
      dockerfile: hotel-pms-service/Dockerfile
    container_name: scenic-hotel-pms-service
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      ADMIN_API_TOKEN: scenic-admin-dev-token
      ROCKETMQ_NAMESRV: rocketmq-namesrv:9876
      PAYMENT_BASE_URL: http://payment-service:8085
      # 本地/测试栈缩短超时关单扫描间隔（生产默认 60s）
      HOTEL_CANCEL_JOB_FIXED_DELAY_MS: "5000"
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started
      payment-service:
        condition: service_healthy

  marketing-service:
    build:
      context: .
      dockerfile: marketing-service/Dockerfile
    container_name: scenic-marketing-service
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      ADMIN_API_TOKEN: scenic-admin-dev-token
    ports:
      - "8089:8089"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8089/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy

  dining-pos-service:
    build:
      context: .
      dockerfile: dining-pos-service/Dockerfile
    container_name: scenic-dining-pos-service
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      ADMIN_API_TOKEN: scenic-admin-dev-token
      ROCKETMQ_NAMESRV: rocketmq-namesrv:9876
      MEMBER_BASE_URL: http://member-service:8083
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started
      member-service:
        condition: service_healthy

  supply-chain-service:
    build:
      context: .
      dockerfile: supply-chain-service/Dockerfile
    container_name: scenic-supply-chain-service
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      ADMIN_API_TOKEN: scenic-admin-dev-token
      ROCKETMQ_NAMESRV: rocketmq-namesrv:9876
    ports:
      - "8091:8091"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8091/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started

  performance-service:
    build:
      context: .
      dockerfile: performance-service/Dockerfile
    container_name: scenic-performance-service
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      ADMIN_API_TOKEN: scenic-admin-dev-token
      ROCKETMQ_NAMESRV: rocketmq-namesrv:9876
      PAYMENT_BASE_URL: http://payment-service:8085
    ports:
      - "8092:8092"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8092/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started
      payment-service:
        condition: service_healthy

  reconciliation-service:
    build:
      context: .
      dockerfile: reconciliation-service/Dockerfile
    container_name: scenic-reconciliation-service
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      ADMIN_API_TOKEN: scenic-admin-dev-token
      ROCKETMQ_NAMESRV: rocketmq-namesrv:9876
    ports:
      - "8093:8093"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8093/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started

volumes:
  mysql-data:
