server:
  port: 8088

spring:
  application:
    name: hotel-pms-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/hotel_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:localhost:9876}
  producer:
    # 本服务仅消费事件，保留 producer group 占位
    group: hotel-pms-service-producer

hotel:
  reservation:
    hold-minutes: 30
  client:
    payment-base-url: ${PAYMENT_BASE_URL:http://localhost:8085}

logging:
  level:
    com.qmp: INFO
